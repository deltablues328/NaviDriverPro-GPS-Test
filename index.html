<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NaviDriver Pro GPS Test</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:sans-serif}
#map{position:absolute;inset:0}
#status{position:absolute;top:12px;left:12px;right:12px;z-index:1000;background:white;padding:12px;border-radius:10px;box-shadow:0 2px 8px #777;font-size:14px}
</style>
</head>
<body>
<div id="map"></div>
<div id="status">GPSを取得しています...</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{maxZoom:24}).setView([31.82,130.30],14);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{attribution:'地理院タイル',maxZoom:24,maxNativeZoom:18}).addTo(map);
let marker=null;
navigator.geolocation.watchPosition(p=>{
const lat=p.coords.latitude,lon=p.coords.longitude;
if(!marker){marker=L.circleMarker([lat,lon],{radius:10,color:'#fff',weight:3,fillColor:'red',fillOpacity:1}).addTo(map);map.setView([lat,lon],17)}
else marker.setLatLng([lat,lon]);
document.getElementById('status').textContent='GPS取得成功：現在地を赤丸で表示中';
},e=>{
document.getElementById('status').textContent='GPSエラー：'+e.message;
},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
</script>
</body>
</html>
